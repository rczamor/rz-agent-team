# /etc/squid/squid.conf — OpenClaw fleet SNI peek+splice egress proxy
# Revised 2026-06-10 (v2). SNI enforcement lives in ssl_bump ONLY; http_access just
# gates source + ports. NO MITM: peek SNI, SPLICE allowed, TERMINATE rest.

http_port 3128 ssl-bump
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/spool/squid/ssl_db -M 4MB

# ---- Sources: shared ollama subnet (all 11 agents) + localhost
acl openclaw_src src 172.19.0.0/16
acl localnet_src src 127.0.0.1/32

# ---- Ports
acl SSL_ports port 443
acl SSL_ports port 465
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 465
acl CONNECT method CONNECT

# ---- SNI allowlist (no parent/child overlaps)
acl allowed_sni ssl::server_name .anthropic.com .ollama.com .ollama.ai .github.com .githubusercontent.com api.notion.com api.linear.app .slack.com .slack-edge.com api.vercel.com api.resend.com smtp.resend.com registry.npmjs.org pypi.org files.pythonhosted.org

# ---- Plain-HTTP (port 80) domain allowlist
acl allowed_dst dstdomain .anthropic.com .ollama.com .ollama.ai .github.com .githubusercontent.com api.notion.com api.linear.app .slack.com .slack-edge.com api.vercel.com api.resend.com smtp.resend.com registry.npmjs.org pypi.org files.pythonhosted.org

# ---- ssl_bump: peek ClientHello SNI at step1, splice allowed, terminate everything else.
#      THIS is the SNI chokepoint. http_access does NOT gate on SNI (timing race).
acl step1 at_step SslBump1
ssl_bump peek step1
ssl_bump splice allowed_sni
ssl_bump terminate all

# ---- http_access: source + port gate only
http_access deny !openclaw_src !localnet_src
http_access deny CONNECT !SSL_ports
http_access deny !Safe_ports
http_access allow CONNECT openclaw_src
http_access allow CONNECT localnet_src
http_access allow openclaw_src allowed_dst
http_access allow localnet_src allowed_dst
http_access deny all

# ---- No caching
cache deny all
cache_mem 8 MB
maximum_object_size 0 KB

# ---- Logging
logfile_rotate 0
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log

# ---- Hygiene
forwarded_for delete
via off
httpd_suppress_version_string on
shutdown_lifetime 5 seconds
visible_hostname egress-proxy
